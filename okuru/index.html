<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'">
<title>物件を送る</title>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;margin:0;background:#f4f5f7;color:#2c3038;padding-bottom:110px;-webkit-text-size-adjust:100%}
.wrap{max-width:680px;margin:0 auto}
header{background:#1a4a7a;color:#fff;padding:14px 16px;font-weight:bold}header small{display:block;font-weight:normal;opacity:.8;font-size:12px;margin-top:2px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:#fff;border-bottom:1px solid #e0e2e7;position:sticky;top:0;z-index:3}
.tabs button{flex:none;border:1px solid #c5d3e3;background:#fff;color:#1a4a7a;border-radius:16px;padding:6px 12px;font-size:14px;font-family:inherit}
.tabs button.on{background:#1a4a7a;color:#fff}
.tabs b{display:inline-block;min-width:18px;margin-left:4px;background:#c0392b;color:#fff;border-radius:9px;font-size:11px;padding:0 5px}
.ch{margin:12px 16px 4px;font-size:13px;color:#5a6270;line-height:1.7}.ch .nm{font-size:17px;font-weight:bold;color:#2c3038}
.warn{color:#a6261b}
.cd{background:#fff;margin:10px 12px;border-radius:10px;border:1px solid #e0e2e7;overflow:hidden}
.cd.sel{border:2px solid #06c755}
.cd.off{opacity:.75}
.ct{display:flex;gap:10px;align-items:flex-start;padding:12px}
.ct input{width:26px;height:26px;flex:none;margin:2px 0 0}
.cn{font-weight:bold;font-size:15px;word-break:break-word}
.sp{font-size:13px;color:#5a6270;line-height:1.6}
.bg{display:inline-block;font-size:11px;font-weight:bold;border-radius:4px;padding:1px 6px;margin:3px 4px 0 0}
.bg.s{background:#e3f4e8;color:#1d6b36}.bg.n{background:#fde8e6;color:#a6261b}.bg.w{background:#fff4d6;color:#7a5a00}.bg.q{background:#e8eef6;color:#1a4a7a}
.zw{border-top:1px solid #eef0f3;min-height:120px;display:flex;align-items:center;justify-content:center;color:#8b929c;font-size:13px;background:#fafbfc}
.zw img{display:block;width:100%;cursor:zoom-in}
.mm{padding:10px 12px 12px;border-top:1px solid #eef0f3;display:none}
.cd.sel .mm{display:block}
.mm label,.fl{font-size:12px;color:#1a4a7a;font-weight:bold}
textarea,input[type=text]{width:100%;font-size:16px;font-family:inherit;border:1px solid #c9d2dc;border-radius:8px;padding:8px;margin-top:4px}
.lk{font-size:13px;margin:6px 12px 10px}.lk a{color:#1a4a7a}
.box{background:#fff;margin:14px 12px;padding:12px;border-radius:10px;border:1px solid #e0e2e7}
.hist{font-size:12.5px;color:#5a6270;line-height:1.7}
#bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e0e2e7;padding:12px 16px;z-index:4}
#go{width:100%;font-size:17px;font-weight:bold;padding:14px;border:0;border-radius:10px;background:#1a4a7a;color:#fff;font-family:inherit}
#go:disabled{background:#b8c2cc}
.em{margin:16px;padding:14px;background:#fff;border-radius:8px;color:#5a6270;font-size:14px;line-height:1.6}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:8;overflow:auto}
#dlg .in{background:#fff;max-width:640px;margin:24px auto;border-radius:14px;padding:18px;width:calc(100% - 24px)}
#dlg h2{font-size:18px;margin:0 0 10px}
#dlg .ds{font-size:14px;line-height:1.7;color:#2c3038}
#dlg .wl{font-size:13px;color:#a6261b;margin-top:8px;line-height:1.6}
#dlg .bt{display:flex;gap:10px;margin-top:14px}
#dlg .bt button{flex:1;font-size:17px;font-weight:bold;padding:14px;border-radius:10px;font-family:inherit}
#cancel{background:#fff;border:1px solid #1a4a7a;color:#1a4a7a}
#send{background:#1a4a7a;border:0;color:#fff}#send:disabled{opacity:.5}
#res{margin-top:10px;font-size:14px;font-weight:bold;text-align:center}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;overflow:auto;z-index:9}
#lb img{width:200%;max-width:none;display:block}
#lb button{position:fixed;top:10px;right:10px;font-size:16px;padding:8px 14px;border-radius:8px;border:0;background:#fff}
</style>
</head>
<body>
<div class="wrap">
<header>📤 物件を送る<small id="sub">読み込んでいます…</small></header>
<div class="tabs" id="tabs"></div>
<div id="main"></div>
</div>
<div id="bar"><button id="go" disabled>送る物件を選んでください</button></div>
<div id="dlg"><div class="in">
  <h2>本当に送信しますか？</h2>
  <div class="ds" id="dto"></div>
  <div id="dtalk" style="margin-top:8px"></div>
  <div class="fl" style="margin-top:12px">本文（このとおりに送ります。直せます）</div>
  <textarea id="dbody" rows="14"></textarea>
  <div class="wl" id="dwarn"></div>
  <div class="bt"><button id="cancel" type="button">キャンセル</button><button id="send" type="button">送信する</button></div>
  <div id="res"></div>
</div></div>
<div id="lb"><button type="button" id="lbx">閉じる</button><img alt="図面（拡大）"></div>
<script>
(function () {
  // 合言葉（承認ページと同じ）とデータの口は「#」の後ろで受け取り、読んだらアドレス欄から消す（タブの sessionStorage だけに置く）
  var h = {};
  String(location.hash || '').replace(/^#/, '').split('&').forEach(function (kv) {
    var i = kv.indexOf('='); if (i > 0) h[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1).replace(/\+/g, ' '));
  });
  if (h.k) { try { sessionStorage.setItem('okuru', JSON.stringify({ k: h.k, u: h.u })); } catch (e) {} }
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  var st = {}; try { st = JSON.parse(sessionStorage.getItem('okuru') || '{}'); } catch (e) {}
  var K = h.k || st.k || '', U = h.u || st.u || '', CUR = h.c || '';
  var D = null, SEL = {}, MEMO = {}, LEAD = {}, TOKEN = '', PENDING = {};
  var main = document.getElementById('main'), tabs = document.getElementById('tabs'), go = document.getElementById('go');
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  if (!K || !/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]{20,}\/exec$/.test(U)) {
    main.innerHTML = '<div class="em">通知の「📤 送る物件を選ぶ」から開いてください。</div>'; document.getElementById('sub').textContent = ''; return;
  }
  function api(q) {
    return fetch(U + '?p=okuru_api&k=' + encodeURIComponent(K) + (q || ''), { credentials: 'omit', cache: 'no-store', referrerPolicy: 'no-referrer', redirect: 'follow' })
      .then(function (r) { return r.json(); });
  }
  function cust() { return ((D && D.custs) || []).filter(function (c) { return c.c === CUR; })[0]; }
  function unsent(c) { return c.items.filter(function (x) { return x.st === 'ok' && !x.sent.length; }).length; }
  function load() {
    api('').then(function (d) {
      if (!d.ok) { main.innerHTML = '<div class="em">' + esc(d.error || '読み込めませんでした') + '</div>'; return; }
      D = d; PENDING = {}; (d.uketsuke || []).forEach(function (t) { PENDING[t] = 1; });
      document.getElementById('sub').textContent = (d.updated || '') + ' 時点';
      if (!cust() && d.custs.length) CUR = d.custs[0].c;
      draw();
    }).catch(function () { main.innerHTML = '<div class="em">読み込めませんでした。開き直してください。</div>'; });
  }
  function draw() {
    tabs.innerHTML = D.custs.map(function (c) {
      var n = unsent(c);
      return '<button type="button" data-c="' + esc(c.c) + '"' + (c.c === CUR ? ' class="on"' : '') + '>' + esc(c.label) + (n ? '<b>' + n + '</b>' : '') + '</button>';
    }).join('');
    var c = cust();
    if (!c) { main.innerHTML = '<div class="em">送れる物件はまだありません。新着一覧で「図面を取得」すると、ここに並びます。</div>'; upd(); return; }
    var to = c.via === 'LINE' ? ('LINE：' + (c.talk ? esc(c.talk) : '<span class="warn">トーク名が顧客ノートにありません（送るときに入力）</span>'))
      : ('SMS：' + esc(c.tel || '') + (c.tel ? '' : '<span class="warn">携帯番号が顧客ノートにありません</span>'));
    var out = ['<div class="ch"><div class="nm">' + esc(c.label) + '</div>' + to + (c.last_sent ? '　／　前回の送付 ' + esc(c.last_sent) : '') + '</div>'];
    c.items.forEach(function (x) {
      var can = x.st === 'ok', on = !!SEL[c.c + '/' + x.pid];
      var bg = '';
      if (x.sent.length) bg += '<span class="bg s">送付済み ' + esc(x.sent.join('・')) + '</span>';
      if (x.st === 'junbi' || x.st === 'kensa') bg += '<span class="bg q">帯消し・検査中</span>';
      if (x.st === 'ng') bg += '<span class="bg n">' + esc(x.reason || '送れません') + '</span>';
      if (x.eye === '未実施') bg += '<span class="bg w">AIの目視は未実施：図面に元付の名前が無いか確かめてから送ってください</span>';
      out.push('<div class="cd' + (on ? ' sel' : '') + (can ? '' : ' off') + '" data-p="' + esc(x.pid) + '">' +
        '<label class="ct"><input type="checkbox" data-p="' + esc(x.pid) + '"' + (on ? ' checked' : '') + (can ? '' : ' disabled') + '>' +
        '<div><div class="cn">' + esc(x.name) + '</div><div class="sp">' + (x.spec || []).map(esc).join('<br>') + '</div>' + bg + '</div></label>' +
        (can ? '<div class="zw" data-p="' + esc(x.pid) + '">図面を読み込んでいます…</div>' : '') +
        (x.naibu ? '<div class="lk"><a href="' + esc(x.naibu) + '" target="_blank" rel="noopener noreferrer">社内用の図面（帯あり）を開く</a></div>' : '') +
        (can ? '<div class="mm"><label>この物件へのメモ（お客様のページと本文に入ります）</label><textarea rows="2" maxlength="200" data-m="' + esc(x.pid) + '" placeholder="例：駅まで5分の角部屋です">' + esc(MEMO[c.c + '/' + x.pid] || '') + '</textarea></div>' : '') +
        '</div>');
    });
    out.push('<div class="box"><div class="fl">最後のひとこと（あなたの見解。本文の最後とページの上に入ります）</div><textarea id="lead" rows="2" maxlength="300" placeholder="例：1が一番おすすめです！">' + esc(LEAD[c.c] || '') + '</textarea></div>');
    var hs = (D.pages || []).filter(function (p) { return p.c === c.c; });
    if (hs.length) out.push('<div class="box hist"><div class="fl">最近の送付</div>' + hs.map(function (p) {
      return esc(p.at.slice(5, 16)) + '　' + p.n + '件　' + esc(p.result || p.st);
    }).join('<br>') + '</div>');
    main.innerHTML = out.join('');
    observe();
    upd();
  }
  function selected() {
    var c = cust(); if (!c) return [];
    return c.items.filter(function (x) { return SEL[c.c + '/' + x.pid]; });
  }
  function upd() {
    var n = selected().length;
    go.disabled = !n; go.textContent = n ? '送る内容を確認（' + n + '件）' : '送る物件を選んでください';
  }
  var lb = document.getElementById('lb'), li = lb.querySelector('img');
  document.getElementById('lbx').addEventListener('click', function () { lb.style.display = 'none'; li.src = ''; });
  var IMGC = {};
  function loadImg(box) {
    var p = box.dataset.p;
    function put(src) {
      var im = new Image(); im.alt = '図面'; im.src = src;
      im.addEventListener('click', function (ev) { ev.preventDefault(); li.src = src; lb.style.display = 'block'; });
      box.textContent = ''; box.appendChild(im);
    }
    if (IMGC[p]) { put(IMGC[p]); return; }
    api('&op=img&i=' + encodeURIComponent(p)).then(function (r) {
      if (!r.ok) { box.textContent = r.error || '図面を表示できません'; return; }
      IMGC[p] = 'data:' + r.mime + ';base64,' + r.data; put(IMGC[p]);
    }).catch(function () { box.textContent = '図面を読み込めませんでした'; });
  }
  function observe() {
    var boxes = [].slice.call(document.querySelectorAll('.zw'));
    if (!('IntersectionObserver' in window)) { boxes.forEach(loadImg); return; }
    var io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { io.unobserve(e.target); loadImg(e.target); } }); }, { rootMargin: '800px' });
    boxes.forEach(function (b) { io.observe(b); });
  }
  tabs.addEventListener('click', function (ev) { var b = ev.target.closest('button'); if (b) { CUR = b.dataset.c; draw(); window.scrollTo(0, 0); } });
  main.addEventListener('change', function (ev) {
    var t = ev.target; if (!t.dataset || !t.dataset.p || t.type !== 'checkbox') return;
    SEL[CUR + '/' + t.dataset.p] = t.checked;
    var cd = t.closest('.cd'); if (cd) cd.classList.toggle('sel', t.checked);
    upd();
  });
  main.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t.dataset && t.dataset.m) MEMO[CUR + '/' + t.dataset.m] = t.value;
    if (t.id === 'lead') LEAD[CUR] = t.value;
  });
  function token() {
    var a = new Uint8Array(32), s = '', cs = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';
    crypto.getRandomValues(a); for (var i = 0; i < 32; i++) s += cs[a[i] % cs.length]; return s;
  }
  function short(x) {
    var r = (x.spec[0] || '').replace(/^賃料\s*/, '').replace(/（.*$/, ''), m = (x.spec[1] || '').split('・')[0];
    return [r, m].filter(Boolean).join('・');
  }
  function bodyText(c, items, url) {
    var L = ['🏠 新着のお部屋をお送りします！'];
    items.forEach(function (x, i) {
      var s = short(x), m = (MEMO[c.c + '/' + x.pid] || '').trim();
      L.push((i + 1) + '. ' + x.name + (s ? '（' + s + '）' : ''));
      if (m) L.push('→ ' + m);
    });
    L.push('', '図面はこちらからご覧いただけます👇', url);
    if (D.naiken) L.push('', D.naiken, '難しい場合はご都合のよい日時をお知らせください。');
    var lead = (LEAD[c.c] || '').trim(); if (lead) L.push('', lead);
    return L.join('\n');
  }
  var dlg = document.getElementById('dlg'), dbody = document.getElementById('dbody'), dwarn = document.getElementById('dwarn'), send = document.getElementById('send'), res = document.getElementById('res');
  function warns() {
    var c = cust(), w = [], items = selected();
    if (items.length > 5) w.push('物件が' + items.length + '件あります。多いと読まれにくくなります（3件までがおすすめ）');
    var all = dbody.value;
    if (/いかがでしょうか|ご興味(が)?ございましたら|ご希望日時がございましたら/.test(all)) w.push('「いかがでしょうか」「ご興味ございましたら」で締めない決まりです');
    items.forEach(function (x) { if ((MEMO[c.c + '/' + x.pid] || '').length > 80) w.push(x.name + ' のメモが長めです（50字くらいまでが返信が多い）'); });
    if (all.indexOf(TOKEN) < 0) w.push('本文にページのリンクがありません（送れません）');
    if (c.via === 'LINE' && /^\S+様\s*$/m.test(all.split('\n')[0])) w.push('LINEの2通目以降は宛名を付けない決まりです');
    dwarn.innerHTML = w.map(function (x) { return '⚠️ ' + esc(x); }).join('<br>');
  }
  go.addEventListener('click', function () {
    var c = cust(), items = selected(); if (!items.length) return;
    TOKEN = token();
    var url = (D.pub_b || 'https://kenta889.github.io/mobile-pages/b/') + '#t=' + TOKEN + '&u=' + U;
    document.getElementById('dto').innerHTML = esc(c.label) + 'に、' + (c.via === 'LINE' ? 'LINE' : 'SMS') + 'で物件' + items.length + '件を送ります。<br>' +
      items.map(function (x, i) { return (i + 1) + '. ' + esc(x.name); }).join('<br>') +
      (c.via === 'SMS' ? '<br><span style="color:#5a6270;font-size:13px">SMSは最初に「' + esc(c.sei) + '様」、最後に「髙橋」を付けて送ります（' + esc(c.tel) + '）</span>' : '');
    var dt = document.getElementById('dtalk');
    if (c.via === 'LINE') {
      dt.innerHTML = '<div class="fl">LINEのトーク名（完全一致で開きます）</div><input type="text" id="talk" value="' + esc(c.talk || '') + '"' + (c.talk ? ' readonly' : ' placeholder="トーク一覧に出る名前をそのまま"') + '>' +
        (c.talk ? '' : '<div class="wl">顧客ノートにトーク名がありません。入力した名前で送れたら、ノートに書き足します。</div>');
    } else dt.innerHTML = '';
    dbody.value = bodyText(c, items, url);
    res.textContent = ''; send.disabled = false; send.textContent = '送信する';
    warns(); dlg.style.display = 'block'; window.scrollTo(0, 0);
  });
  dbody.addEventListener('input', warns);
  document.getElementById('cancel').addEventListener('click', function () { dlg.style.display = 'none'; });
  send.addEventListener('click', function () {
    var c = cust(), items = selected(), talkEl = document.getElementById('talk');
    var talk = talkEl ? talkEl.value.trim() : '';
    if (c.via === 'LINE' && !talk) { res.textContent = 'LINEのトーク名を入れてください'; return; }
    if (dbody.value.indexOf(TOKEN) < 0) { res.textContent = '本文にページのリンクが必要です'; return; }
    var q = { t: TOKEN, c: c.c, via: c.via, talk: talk, text: dbody.value, lead: (LEAD[c.c] || '').trim(),
      items: items.map(function (x) { return { pid: x.pid, memo: (MEMO[c.c + '/' + x.pid] || '').trim() }; }) };
    send.disabled = true; send.textContent = '送っています…';
    // 本文が長いと GET の上限（約8KB）を超えるので POST（text/plain＝事前確認なし）。同じ32文字の依頼は二重にならない
    fetch(U + '?p=okuru_api&op=send&k=' + encodeURIComponent(K), { method: 'POST', body: JSON.stringify(q), headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      credentials: 'omit', cache: 'no-store', referrerPolicy: 'no-referrer', redirect: 'follow' }).then(function (r) { return r.json(); }).then(function (r) {
      if (!r.ok) { res.textContent = '送れませんでした：' + (r.error || ''); send.disabled = false; send.textContent = '送信する'; return; }
      res.textContent = '受け付けました。2〜4分で送ります（結果は通知でお知らせします）';
      send.textContent = '受け付けました';
      items.forEach(function (x) { SEL[c.c + '/' + x.pid] = false; });
      setTimeout(function () { dlg.style.display = 'none'; load(); }, 2500);
    }).catch(function () { res.textContent = '送れませんでした（通信エラー）。少し待って押し直してください'; send.disabled = false; send.textContent = '送信する'; });
  });
  load();
})();
</script>
</body>
</html>
