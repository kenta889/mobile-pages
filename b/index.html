<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<meta property="og:title" content="物件のご紹介">
<meta property="og:description" content="お部屋の図面をまとめました">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'">
<title>物件のご紹介</title>
<style>
:root{--ink:#1f2933;--sub:#5b6670;--line:#e3e7eb;--accent:#1d4e89;--bg:#f6f7f9}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:var(--ink);background:var(--bg);line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:20px;margin:4px 0 2px}
.date{margin:0;color:var(--sub);font-size:13px}
.lead{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:14px 0;font-size:15px;white-space:pre-wrap;word-break:break-word}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;margin:16px 0;overflow:hidden}
.top{display:flex;gap:10px;align-items:center;padding:12px 14px 6px}
.no{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.name{font-weight:700;font-size:16px;word-break:break-word}
.memo{margin:4px 14px 10px;padding:8px 10px;background:#eef4fb;border-left:3px solid var(--accent);border-radius:4px;font-size:14px;white-space:pre-wrap;word-break:break-word}
.spec{margin:0;padding:0 14px 10px;list-style:none;font-size:14px}
.spec li{padding:1px 0}
.zw{border-top:1px solid var(--line);background:#fafbfc;min-height:180px;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:13px}
.zw img{display:block;width:100%;cursor:zoom-in}
.hint{font-size:12px;color:var(--sub);text-align:center;padding:4px 0 8px}
.links{padding:0 14px 14px}
.links a{display:block;text-align:center;font-size:14px;padding:9px 0;border:1px solid var(--accent);color:var(--accent);border-radius:8px;text-decoration:none}
.msg{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;color:var(--sub);font-size:14px;margin-top:16px}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;overflow:auto;z-index:9}
#lb img{width:200%;max-width:none;display:block}
#lb button{position:fixed;top:10px;right:10px;font-size:16px;padding:8px 14px;border-radius:8px;border:0;background:#fff}
</style>
</head>
<body>
<div class="wrap">
  <h1>物件のご紹介</h1>
  <p class="date" id="date"></p>
  <div id="main"><div class="msg">読み込んでいます…</div></div>
</div>
<div id="lb"><button type="button" id="lbx">閉じる</button><img alt="図面（拡大）"></div>
<script>
(function () {
  // リンクは「#<32文字>」だけ（2026-11-23 短くした）。データの口はお客様用の読むだけのGAS（合言葉の要る口は持たない）。
  // 古い形「#t=<32文字>&u=…」も読める。お名前・条件はページにもデータにも入っていない
  var PUB = 'https://script.google.com/macros/s/AKfycbygeAgnoNPxnfMBtGhqc-xmkrEdTvKPTUoGi8rL6D7cUpgzzoSrGc4hP3BJQM3nyf8/exec';
  var raw = String(location.hash || '').replace(/^#/, ''), h = {};
  raw.split('&').forEach(function (kv) {
    var i = kv.indexOf('='); if (i > 0) h[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1));
  });
  var T = /^[A-Za-z0-9]{32}$/.test(raw) ? raw : (h.t || ''), U = PUB, OLD = !!h.u;
  var main = document.getElementById('main');
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function fail(m) { main.innerHTML = '<div class="msg">' + esc(m) + '</div>'; }
  if (!/^[A-Za-z0-9]{32}$/.test(T) || !/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]{20,}\/exec$/.test(U)) { fail('リンクが正しくありません。お送りしたメッセージのリンクから開いてください。'); return; }
  function api(q) {
    return fetch(U + '?t=' + T + (q || ''), { credentials: 'omit', cache: 'no-store', referrerPolicy: 'no-referrer', redirect: 'follow' })
      .then(function (r) { return r.json(); });
  }
  var lb = document.getElementById('lb'), li = lb.querySelector('img');
  document.getElementById('lbx').addEventListener('click', function () { lb.style.display = 'none'; li.src = ''; });
  function loadImg(box) {
    if (box.dataset.done) return; box.dataset.done = '1';
    api('&n=' + box.dataset.n).then(function (r) {
      if (!r.ok) { box.textContent = r.error || '図面を表示できませんでした'; return; }
      var im = new Image(); im.alt = '図面'; im.src = 'data:' + r.mime + ';base64,' + r.data;
      im.addEventListener('click', function () { li.src = im.src; lb.style.display = 'block'; });
      box.textContent = ''; box.appendChild(im);
      var hn = document.createElement('div'); hn.className = 'hint'; hn.textContent = '図面をタップすると大きく見られます';
      box.parentNode.insertBefore(hn, box.nextSibling);
    }).catch(function () { box.dataset.done = ''; box.textContent = '図面を読み込めませんでした（電波の良いところで開き直してください）'; });
  }
  api('').then(function (d) {
    if (!d.ok) { fail(d.error || 'ページが見つかりません'); return; }
    document.getElementById('date').textContent = d.date || '';
    var out = [];
    if (d.lead) out.push('<div class="lead">' + esc(d.lead) + '</div>');
    (d.items || []).forEach(function (x) {
      out.push('<div class="card"><div class="top"><div class="no">' + esc(x.no) + '</div><div class="name">' + esc(x.name) + '</div></div>' +
        (x.memo ? '<div class="memo">' + esc(x.memo) + '</div>' : '') +
        '<ul class="spec">' + (x.spec || []).map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ul>' +
        '<div class="zw" data-n="' + esc(x.no) + '">図面を読み込んでいます…</div>' +
        (x.map ? '<div class="links" style="padding-top:10px"><a href="' + esc(x.map) + '" target="_blank" rel="noopener noreferrer">地図を開く</a></div>' : '') +
        '</div>');
    });
    if (!(d.items || []).length) out.push('<div class="msg">こちらのお部屋は募集が終了しました。新しいお部屋をお探ししてお送りします！</div>');
    main.innerHTML = out.join('');
    var boxes = [].slice.call(document.querySelectorAll('.zw'));
    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { io.unobserve(e.target); loadImg(e.target); } }); }, { rootMargin: '600px' });
      boxes.forEach(function (b) { io.observe(b); });
    } else boxes.forEach(loadImg);
  }).catch(function () { fail('読み込めませんでした。電波の良いところで開き直してください。'); });
})();
</script>
</body>
</html>
